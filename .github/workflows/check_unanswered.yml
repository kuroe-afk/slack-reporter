name: 対応漏れチェック

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: .envファイルを作成
        run: |
          echo "MONITOR_SLACK_BOT_TOKEN=${{ secrets.MONITOR_SLACK_BOT_TOKEN }}" >> .env
          echo "MONITOR_REPORT_CHANNEL_ID=${{ secrets.MONITOR_REPORT_CHANNEL_ID }}" >> .env
          echo "MONITOR_TARGET_CHANNEL_IDS=${{ secrets.MONITOR_TARGET_CHANNEL_IDS }}" >> .env

      - name: スクリプトを実行
        run: python check_unanswered.py
