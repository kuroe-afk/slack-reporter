name: Gmailトークン更新リマインド（毎週月曜）

on:
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 09:00 JST
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Slackにリマインド通知
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{
            "text": "⚠️ *Gmailトークン更新リマインド*\n以下のアカウントのトークンは7日で期限切れになります。\nローカルで `python get_refresh_token.py` を実行して更新してください。\n\n対象アカウント：\n• `tasukaru.jimucenter@gmail.com` → `GMAIL_REFRESH_TOKEN_JIMUCENTER`\n• `okanaho.sango@gmail.com` → `GMAIL_REFRESH_TOKEN_SANGO_OKA`"
          }' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
