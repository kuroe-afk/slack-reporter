name: 営業リスト日次まとめ

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: .envファイルを作成
        run: |
          echo "SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}" >> .env
          echo "DAILY_SUMMARY_CHANNEL_ID=${{ secrets.DAILY_SUMMARY_CHANNEL_ID }}" >> .env

      - name: スクリプトを実行
        run: python fetch_slack_daily_summary.py
