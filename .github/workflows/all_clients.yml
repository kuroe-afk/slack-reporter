name: 全クライアント報告取得・通知（まとめて実行）

on:
  workflow_dispatch:

concurrency:
  group: all-clients-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: .envファイルを作成
        run: |
          echo "SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}" >> .env
          echo "SLACK_CHANNEL_ID=${{ secrets.SLACK_CHANNEL_ID }}" >> .env
          echo "SLACK_NOTIFY_CHANNEL_ID=${{ secrets.SLACK_NOTIFY_CHANNEL_ID }}" >> .env
          echo "SLACK_MENTION=${{ secrets.SLACK_MENTION }}" >> .env
          echo "SLACK_SOURCE_CHANNEL_NAME=${{ secrets.SLACK_SOURCE_CHANNEL_NAME }}" >> .env
          echo "ACTY_SLACK_CHANNEL_ID=${{ secrets.ACTY_SLACK_CHANNEL_ID }}" >> .env
          echo "ACTY_SPREADSHEET_ID=${{ secrets.ACTY_SPREADSHEET_ID }}" >> .env
          echo "SAMURAIZ_SLACK_CHANNEL_ID=${{ secrets.SAMURAIZ_SLACK_CHANNEL_ID }}" >> .env
          echo "SAMURAIZ_SPREADSHEET_ID=${{ secrets.SAMURAIZ_SPREADSHEET_ID }}" >> .env
          echo "SANGO_SLACK_CHANNEL_ID=${{ secrets.SANGO_SLACK_CHANNEL_ID }}" >> .env
          echo "SANGO_SPREADSHEET_ID=${{ secrets.SANGO_SPREADSHEET_ID }}" >> .env
          echo "IXREA_SLACK_CHANNEL_ID=${{ secrets.IXREA_SLACK_CHANNEL_ID }}" >> .env
          echo "IXREA_SPREADSHEET_ID=${{ secrets.IXREA_SPREADSHEET_ID }}" >> .env
          echo "MIRAI_SLACK_CHANNEL_ID=${{ secrets.MIRAI_SLACK_CHANNEL_ID }}" >> .env
          echo "MIRAI_SPREADSHEET_ID=${{ secrets.MIRAI_SPREADSHEET_ID }}" >> .env
          echo "RERON_SLACK_CHANNEL_ID=${{ secrets.RERON_SLACK_CHANNEL_ID }}" >> .env
          echo "RERON_NOTIFY_CHANNEL_ID=${{ secrets.RERON_NOTIFY_CHANNEL_ID }}" >> .env
          echo "RERON_SPREADSHEET_ID=${{ secrets.RERON_SPREADSHEET_ID }}" >> .env
          echo "APPLANNING_SLACK_CHANNEL_ID=${{ secrets.APPLANNING_SLACK_CHANNEL_ID }}" >> .env
          echo "APPLANNING_NOTIFY_CHANNEL_ID=${{ secrets.APPLANNING_NOTIFY_CHANNEL_ID }}" >> .env
          echo "APPLANNING_SPREADSHEET_ID=${{ secrets.APPLANNING_SPREADSHEET_ID }}" >> .env
          echo "GMS_SLACK_CHANNEL_ID=${{ secrets.GMS_SLACK_CHANNEL_ID }}" >> .env
          echo "GMS_NOTIFY_CHANNEL_ID=${{ secrets.GMS_NOTIFY_CHANNEL_ID }}" >> .env
          echo "GMS_SPREADSHEET_ID=${{ secrets.GMS_SPREADSHEET_ID }}" >> .env
          echo "NIPPONGAS_SLACK_CHANNEL_ID=${{ secrets.NIPPONGAS_SLACK_CHANNEL_ID }}" >> .env
          echo "NIPPONGAS_NOTIFY_CHANNEL_ID=${{ secrets.NIPPONGAS_NOTIFY_CHANNEL_ID }}" >> .env
          echo "NIPPONGAS_SPREADSHEET_ID=${{ secrets.NIPPONGAS_SPREADSHEET_ID }}" >> .env
          echo "BRIDGEPLUS_SLACK_CHANNEL_ID=${{ secrets.BRIDGEPLUS_SLACK_CHANNEL_ID }}" >> .env
          echo "BRIDGEPLUS_SPREADSHEET_ID=${{ secrets.BRIDGEPLUS_SPREADSHEET_ID }}" >> .env
          echo "GMAIL_CLIENT_ID=${{ secrets.GMAIL_CLIENT_ID }}" >> .env
          echo "GMAIL_CLIENT_SECRET=${{ secrets.GMAIL_CLIENT_SECRET }}" >> .env
          echo "GMAIL_REFRESH_TOKEN_ACTY=${{ secrets.GMAIL_REFRESH_TOKEN_ACTY }}" >> .env
          echo "GMAIL_REFRESH_TOKEN_JIMUCENTER=${{ secrets.GMAIL_REFRESH_TOKEN_JIMUCENTER }}" >> .env
          echo "GMAIL_REFRESH_TOKEN_SAMURAIZ=${{ secrets.GMAIL_REFRESH_TOKEN_SAMURAIZ }}" >> .env
          echo "GMAIL_REFRESH_TOKEN_MIRAI=${{ secrets.GMAIL_REFRESH_TOKEN_MIRAI }}" >> .env
          echo "GMAIL_REFRESH_TOKEN_BRIDGEPLUS=${{ secrets.GMAIL_REFRESH_TOKEN_BRIDGEPLUS }}" >> .env
          echo "GMAIL_REFRESH_TOKEN_DATAREIN=${{ secrets.GMAIL_REFRESH_TOKEN_DATAREIN }}" >> .env
          echo "GMAIL_REFRESH_TOKEN_EXKEY=${{ secrets.GMAIL_REFRESH_TOKEN_EXKEY }}" >> .env
          echo "GMAIL_REFRESH_TOKEN_SANGO_OKA=${{ secrets.GMAIL_REFRESH_TOKEN_SANGO_OKA }}" >> .env
          echo "IREIZHONS_SPREADSHEET_ID=${{ secrets.IREIZHONS_SPREADSHEET_ID }}" >> .env
          echo "DART_POINT_SPREADSHEET_ID=${{ secrets.DART_POINT_SPREADSHEET_ID }}" >> .env
          echo "NAHOOKA_BOT_TOKEN=${{ secrets.NAHOOKA_BOT_TOKEN }}" >> .env

      - name: credentials.jsonを作成
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: 全クライアント分をまとめて実行
        run: python run_all.py

      - name: 処理済みタイムスタンプをリポジトリに保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_timestamp*.txt
          git diff --cached --quiet || git commit -m "chore: 処理済みタイムスタンプを更新"
          git pull --rebase origin main
          git push
