name: サンゴ様報告取得・通知

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: .envファイルを作成
        run: |
          echo "SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}" >> .env
          echo "SLACK_NOTIFY_CHANNEL_ID=${{ secrets.SLACK_NOTIFY_CHANNEL_ID }}" >> .env
          echo "SLACK_MENTION=${{ secrets.SLACK_MENTION }}" >> .env
          echo "SANGO_SLACK_CHANNEL_ID=${{ secrets.SANGO_SLACK_CHANNEL_ID }}" >> .env
          echo "SANGO_SPREADSHEET_ID=${{ secrets.SANGO_SPREADSHEET_ID }}" >> .env

      - name: credentials.jsonを作成
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: 前回のタイムスタンプを復元
        uses: actions/cache@v4
        with:
          path: last_timestamp_sango.txt
          key: last-timestamp-sango-${{ github.run_id }}
          restore-keys: |
            last-timestamp-sango-
          save-always: true

      - name: スクリプトを実行
        run: python fetch_slack_sango.py
