name: Slack報告取得・通知

on:
  schedule:
    # 日本時間 9:00〜21:00 の15分おき（UTCで0:00〜12:00）
    - cron: '0,15,30,45 0-12 * * *'
  workflow_dispatch: # 手動実行ボタンも使えるようにする

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: .envファイルを作成
        run: |
          echo "SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}" >> .env
          echo "SLACK_CHANNEL_ID=${{ secrets.SLACK_CHANNEL_ID }}" >> .env
          echo "SLACK_NOTIFY_CHANNEL_ID=${{ secrets.SLACK_NOTIFY_CHANNEL_ID }}" >> .env
          echo "SLACK_MENTION=${{ secrets.SLACK_MENTION }}" >> .env
          echo "SLACK_SOURCE_CHANNEL_NAME=${{ secrets.SLACK_SOURCE_CHANNEL_NAME }}" >> .env

      - name: credentials.jsonを作成
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: スクリプトを実行
        run: python fetch_slack.py
